name: Release ZIP

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag (e.g. v1.0.0) — used as the release name"
        required: true
        default: "v1.1.2"

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          composer install --no-interaction --prefer-dist

      - name: Start WordPress and WooCommerce test environment
        run: |
          pnpm start > wp-env.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8890/wp-login.php > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat wp-env.log
          exit 1

      - name: Install browser test dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Validate and build release artifact
        run: |
          pnpm test:unit
          pnpm test:integration
          pnpm test:e2e
          pnpm make:mo
          pnpm build:zip
          unzip -l aldersverificering-woocommerce.zip
          if unzip -l aldersverificering-woocommerce.zip | grep -Eq 'test-results|playwright|tests/|scripts/'; then
            echo "Release archive contains development files."
            exit 1
          fi
          shasum -a 256 aldersverificering-woocommerce.zip > aldersverificering-woocommerce.zip.sha256

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
            wp-env.log
          if-no-files-found: ignore

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            aldersverificering-woocommerce.zip
            aldersverificering-woocommerce.zip.sha256
          generate_release_notes: true
