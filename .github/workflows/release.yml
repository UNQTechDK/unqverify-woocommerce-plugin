name: Release ZIP

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag (e.g. v1.0.0) — used as the release name"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Build plugin ZIP
        run: |
          # Copy repo contents into a named folder so WordPress extracts correctly
          mkdir -p build/aldersverificering-woocommerce
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='tests' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='*.lock' \
            --exclude='package.json' \
            --exclude='pnpm-lock.yaml' \
            --exclude='composer.json' \
            --exclude='composer.lock' \
            --exclude='vitest.config*' \
            --exclude='phpunit.xml*' \
            --exclude='MANUAL_TEST_SUITE.md' \
            ./ build/aldersverificering-woocommerce/
          cd build && zip -r ../aldersverificering-woocommerce.zip aldersverificering-woocommerce/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: aldersverificering-woocommerce.zip
          generate_release_notes: true
